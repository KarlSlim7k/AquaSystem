<!DOCTYPE html>
<html>
<head>
    <title>Test API Connection</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test de Conectividad API</h1>
    <p>Backend URL: <strong id="apiUrl"></strong></p>
    
    <button onclick="testConnection()">Test Conexión</button>
    <button onclick="testLogin()">Test Login (admin/admin123)</button>
    
    <div id="results"></div>

    <script>
        const API_URL = 'https://fs151wjc-443.usw3.devtunnels.ms';
        document.getElementById('apiUrl').textContent = API_URL;

        function addResult(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        async function testConnection() {
            document.getElementById('results').innerHTML = '';
            addResult('🔍 Probando conexión...');
            
            try {
                const response = await fetch(`${API_URL}/api/me`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });
                
                addResult(`✅ Respuesta recibida: Status ${response.status}`);
                const data = await response.json();
                addResult(`📦 Datos: ${JSON.stringify(data)}`);
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, true);
            }
        }

        async function testLogin() {
            document.getElementById('results').innerHTML = '';
            addResult('🔐 Intentando login...');
            
            try {
                // Enviar como form-urlencoded para compatibilidad con el backend demo
                const form = new URLSearchParams();
                form.append('username', 'admin');
                form.append('password', 'admin123');

                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: form.toString()
                });
                
                addResult(`✅ Respuesta recibida: Status ${response.status}`);
                const data = await response.json();
                addResult(`📦 Datos: ${JSON.stringify(data, null, 2)}`);
                
                if (data.success) {
                    addResult(`🎉 ¡Login exitoso! Token: ${data.data.token.substring(0, 20)}...`);
                }
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, true);
                console.error('Error completo:', error);
            }
        }
    </script>
</body>
</html>
